<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live2D Audio Demo</title>
    <!-- 添加favicon避免404错误 -->
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <style>
        html, body {
          overflow: hidden;
          margin: 0;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html {
          overscroll-behavior-x: none;
          touch-action: none;
        }
        body {
          display: flex;
          flex-wrap: wrap;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body > canvas:only-child {
          width: 100vw;
          height: 100vh;
        }

        .play-button {
          position: fixed;
          bottom: 300px;
          left: 50%;
          transform: translateX(-50%);
          width: 60px;
          height: 60px;
          border: 2px solid #333;
          background: white;
          border-radius: 50%;
          font-size: 20px;
          cursor: pointer;
          z-index: 1000;
          display: none;
        }

        .play-button:hover {
          background: #f0f0f0;
        }
    </style>
    <!-- Live2DCubismCore script -->
    <script src="./Core/live2dcubismcore.js"></script>
    <!-- Build script -->
    <script type="module" crossorigin src="./assets/index-Bi2G4O9r.js"></script>
</head>
<body>
<!-- 播放按钮 -->
<button class="play-button" id="playButton">
    <span id="playIcon">▶</span>
</button>
</body>
</html>
